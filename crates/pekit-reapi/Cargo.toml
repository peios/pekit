[package]
name = "pekit-reapi"
description = "Bazel's Remote Execution API and ByteStream, as gRPC clients for pekit's remote cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT AND Apache-2.0"

# The generated code is not pekit's own, so the workspace's lints, pedantic
# and missing documentation among them, are not asked of it: Rust's and
# Clippy's defaults are.

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server", "transport"] }
tonic-prost = "0.14"

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"
