[package]
name = "pekit"
description = "Pekit, a build system that runs GCSL build files as an action graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# GCSL at a pinned commit. To build against a local checkout instead, give
# Cargo a patch, such as in `.cargo/config.toml`:
#   [patch."https://github.com/peios/gcsl"]
#   gcsl = { path = "../gcsl/crates/gcsl" }
#   gcsl-disk = { path = "../gcsl/crates/gcsl-disk" }
gcsl = { git = "https://github.com/peios/gcsl", rev = "db8f959dc3b6a5a1ce67178333222fabc038294a" }
gcsl-disk = { git = "https://github.com/peios/gcsl", rev = "db8f959dc3b6a5a1ce67178333222fabc038294a" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
liblzma = { version = "0.4", features = ["static"] }
bzip2 = "0.6"
zstd = "0.13"
ureq = "3"
xattr = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The remote cache (`design/additive.md`, F5).
pekit-reapi = { path = "../pekit-reapi" }
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-native-roots"] }

[dev-dependencies]
flate2 = "1"
# The tests' remote cache.
pekit-reapi = { path = "../pekit-reapi" }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["router", "server", "transport"] }
liblzma = { version = "0.4", features = ["static"] }
tar = "0.4"
tempfile = "3.27"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
