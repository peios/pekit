[package]
name = "pekit"
description = "Pekit, a build system that runs GCSL build files as an action graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# GCSL at a pinned commit. To build against a local checkout instead, give
# Cargo a patch, such as in `.cargo/config.toml`:
#   [patch."https://github.com/peios/gcsl"]
#   gcsl = { path = "../gcsl/crates/gcsl" }
#   gcsl-disk = { path = "../gcsl/crates/gcsl-disk" }
gcsl = { git = "https://github.com/peios/gcsl", rev = "75f15f206d84000f6e0b52f4406a0eff8052d595" }
gcsl-disk = { git = "https://github.com/peios/gcsl", rev = "75f15f206d84000f6e0b52f4406a0eff8052d595" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
liblzma = { version = "0.4", features = ["static"] }
bzip2 = "0.6"
zstd = "0.13"
ureq = "3"
xattr = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Walking a tree by descriptors, without `unsafe`: removing one deeper than
# a process may open descriptors or a path may be long. And setting the
# file-creation mask every program pekit starts has.
rustix = { version = "1.1", features = ["fs", "process"] }
# Starting every program with default signal dispositions, without `unsafe`:
# a signal caught, unlike one ignored, is reset by `exec`.
signal-hook = "0.4"
# The remote cache (`design/additive.md`, F5).
pekit-reapi = { path = "../pekit-reapi" }
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-native-roots"] }

[dev-dependencies]
flate2 = "1"
# The tests' remote cache.
pekit-reapi = { path = "../pekit-reapi" }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["router", "server", "transport"] }
liblzma = { version = "0.4", features = ["static"] }
# Making a tree deeper than the descriptor limit, which it lowers.
rustix = { version = "1.1", features = ["fs", "process"] }
tar = "0.4"
tempfile = "3.27"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
