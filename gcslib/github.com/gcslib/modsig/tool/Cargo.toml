[package]
name = "modsig"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"
description = "Signs a tree of Linux kernel modules reproducibly, with ML-DSA-65"

[workspace]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
ml-dsa = { version = "0.1", default-features = false }
# A signed module's bytes are libzstd's, so the version Cargo.lock pins is
# part of the identity of every package that holds one.
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3.23"
zstd = { version = "0.14", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
